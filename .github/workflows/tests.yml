name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check public source boundaries
        run: python tools/check_public_tree.py
      - name: Test room state and source identity
        run: python -m unittest discover -s tests -p 'test*.py'
